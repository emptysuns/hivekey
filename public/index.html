<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llm-api-pool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231a1a19'/%3E%3Ccircle cx='12' cy='12' r='5.5' fill='%233987e5'/%3E%3Ccircle cx='12' cy='12' r='2.2' fill='%230d0d0d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login -->
<div id="login-view" class="hidden">
  <form id="login-form" class="login-card" autocomplete="on">
    <div class="login-brand">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#2a78d6"/><circle cx="12" cy="12" r="5.5" fill="#fff"/><circle cx="12" cy="12" r="2.2" fill="#2a78d6"/></svg>
      <h1>llm-api-pool</h1>
    </div>
    <p class="login-sub">Admin console — sign in to continue</p>
    <div class="field">
      <label for="login-username">Username</label>
      <input id="login-username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary" id="login-btn">Sign in</button>
    <div id="login-error" class="login-error hidden"></div>
  </form>
</div>

<!-- App shell -->
<div id="shell" class="hidden">
  <aside id="sidebar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#2a78d6"/><circle cx="12" cy="12" r="5.5" fill="#fff"/><circle cx="12" cy="12" r="2.2" fill="#2a78d6"/></svg>
      <span class="brand-name">llm-api-pool</span>
    </div>
    <nav id="nav">
      <a href="#/dashboard" data-route="dashboard" title="Dashboard">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
        <span class="lbl">Dashboard</span>
      </a>
      <a href="#/channels" data-route="channels" title="Channels">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M6.6 7.5h.01M6.6 16.5h.01"/></svg>
        <span class="lbl">Channels</span>
      </a>
      <a href="#/tokens" data-route="tokens" title="Access tokens">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="12" r="4.2"/><path d="M12.2 12H21M17.5 12v3.2M20.9 12v2.2"/></svg>
        <span class="lbl">Tokens</span>
      </a>
      <a href="#/logs" data-route="logs" title="Logs">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h.01M4 12h.01M4 18h.01M8.5 6H20M8.5 12H20M8.5 18H20"/></svg>
        <span class="lbl">Logs</span>
      </a>
      <a href="#/settings" data-route="settings" title="Settings">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7.5h7.5M17.5 7.5H20M4 16.5h2.5M12.5 16.5H20"/><circle cx="14.5" cy="7.5" r="2.2"/><circle cx="9.5" cy="16.5" r="2.2"/></svg>
        <span class="lbl">Settings</span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <div id="conn-status"><span class="conn-dot"></span><span class="conn-text">Disconnected</span></div>
      <div id="whoami"></div>
      <button id="logout-btn" class="btn btn-sm" data-action="logout" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M15 8l4 4-4 4M9 12h10"/></svg>
        Logout
      </button>
    </div>
  </aside>
  <main id="main">
    <div id="view"></div>
  </main>
</div>

<div id="modal-root" class="hidden"></div>
<div id="toast-root"></div>

<script src="app.js"></script>
</body>
</html>
