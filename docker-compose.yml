services:
  hivekey:
    build: .
    container_name: hivekey
    ports:
      - "3000:3000"
    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=change-me-please
      # - SESSION_SECRET=some-long-random-string
      # - OUTBOUND_PROXY=http://192.168.1.1:7890   # global fallback outbound proxy
      # - TRUST_PROXY=1                            # set when behind nginx/traefik
    volumes:
      - pool-data:/app/data
    restart: unless-stopped

volumes:
  pool-data:
